name: "Build"
run-name: "[📦]: Build #${{ github.run_number }}"
on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/**'
      - 'gradle/**'
      - 'src/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'CHANGELOG.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  info:
    name: "[🖥️] Project Info"
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.fork }}
    outputs:
      name: ${{ steps.info.outputs.name }}
      version: ${{ steps.info.outputs.version }}
      version_type: ${{ steps.info.outputs.version_type }}
      full_name: ${{ steps.info.outputs.full_name }}
      loaders: ${{ steps.info.outputs.loaders }}
      game_versions: ${{ steps.info.outputs.game_versions }}
      java_version: ${{ steps.info.outputs.java_version }}
      make_release: ${{ steps.info.outputs.make_release }}
    steps:
      - name: Collect info
        id: info
        uses: TerraFirmaGreg-Team/Actions/mod/info@main
        with:
          required_files: "gradle.properties, build.gradle, LICENSE, README.md, src"

  build:
    name: "[📦] Project Build"
    needs: [info]
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: TerraFirmaGreg-Team/Actions/mod/build@main
        with:
          version: ${{ needs.info.outputs.version }}
          replace_version: true
          java_version: ${{ needs.info.outputs.java_version }}
          gradle_args: build -x spotlessCheck -x spotlessApply -x spotlessJava -x spotlessJson
          artifact_name: ${{ needs.info.outputs.full_name }}
          artifact_path: build/libs/${{ needs.info.outputs.full_name }}.jar

  release:
    name: "[🚀] Project Release"
    needs: [info, build]
    runs-on: ubuntu-latest
    if: ${{ needs.info.outputs.make_release == 'true' }}
    steps:
      - name: Publish
        uses: TerraFirmaGreg-Team/Actions/mod/release@main
        with:
          full_name: ${{ needs.info.outputs.full_name }}
          version: ${{ needs.info.outputs.version }}
          version_type: ${{ needs.info.outputs.version_type }}
          files: ${{ needs.info.outputs.full_name }}.jar
          github_name: ${{ needs.info.outputs.version }}
          github_prerelease: ${{ needs.info.outputs.version_type != 'release' }}
          loaders: ${{ needs.info.outputs.loaders }}
          game_versions: ${{ needs.info.outputs.game_versions }}
          java: ${{ needs.info.outputs.java_version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          modrinth_id: ${{ vars.MODRINTH_ID }}
          modrinth_token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge_id: ${{ vars.CURSEFORGE_ID }}
          curseforge_token: ${{ secrets.CURSEFORGE_TOKEN }}
