# Gradle Properties
org.gradle.jvmargs                  = -Xmx8G -Dnet.minecraftforge.gradle.test_certs=false -Djline.terminal=dumb
org.gradle.parallel                 = true
org.gradle.caching                  = true
org.gradle.logging.stacktrace       = all

# Mod Information
# HIGHLY RECOMMEND complying with SemVer for mod_version: https://semver.org/
mod_version                         = 0.9.31
mod_version_type                    = release
mod_package                         = su.terrafirmagreg
mod_id                              = tfg
mod_name                            = TerraFirmaGreg-Core
mod_name_suffix                     = Modern

# Mod Metadata (Optional)
mod_description                     = Compat mod for TFC, GTCEu, and the other parts of TerraFirmaGreg.
mod_url                             = https://www.curseforge.com/minecraft/mc-mods/terrafirmagreg-core

# Delimit authors with commas
mod_authors                         = Exception, Xikaro, Zleub, Pyritie, aidie8, jojo7682345, Redeix, Thomasx0, Gustavo, AirRice, Zeropol, voidstar240, Mqrius, Ujhik, TomPlop, SakuraKitsurugi, ashleney, et. al.
mod_credits                         = Bioxx, Dunkleosteus, Kittychanley for the original TerraFirmaCraft for 1.7.10 and before.
mod_logo_path                       = /assets/tfg/textures/gui/logo.png

# Mapping Properties
mapping_channel                     = parchment
mapping_version                     = 2023.09.03-1.20.1
use_dependency_at_files             = true

# The Minecraft version the Parchment version is for
neoForge.parchment.minecraftVersion = 1.20.1
# The version of the Parchment mappings
neoForge.parchment.mappingsVersion  = 2023.09.03

# Run Configurations
# If multiple arguments/tweak classes are stated, use spaces as the delimiter
minecraft_version                   = 1.20.1
minecraft_username                  = Developer

### Dependency versions

# Build environment
java_version                        = 17
gradle_version                      = 8.12.1

# Forge
loader                              = forge
forge_version                       = 47.4.13
loader_version_range                = [47,)

