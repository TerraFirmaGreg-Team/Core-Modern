modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "LGPLv3"
issueTrackerURL = "https://github.com/TerraFirmaGreg-Team/Modpack-Modern/issues"

# ============================================================
# TerraFirmaCraft
# ============================================================

[[mods]]
modId = "tfc"
version = "3.2.25"
displayName = "TerraFirmaCraft"
credits = "By AlcatrazEscapee, Disastermoo, Dries007, Bunsan, Claycorp, DavidTriphon, EERussianguy, Gaelmare, and many others. Based on the original work by Bioxx, Dunk, and Kitty. Music by Mike \"Menoch\" Pelaez"
authors = "AlcatrazEscapee"
description = '''TerraFirmaCraft - The Next Generation'''

[[dependencies.tfc]]
modId = "patchouli"
mandatory = true
versionRange = "[1.20.1-81-FORGE,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.tfc]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.tfc]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version}"
ordering = "NONE"
side = "BOTH"

