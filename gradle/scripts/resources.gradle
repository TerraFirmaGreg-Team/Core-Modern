import groovy.json.JsonOutput
import groovy.json.JsonSlurper

File mainResources = file('src/main/resources')
File generatedResources = file('src/generated/resources')
String tagPattern = 'data/*/tags/**/*.json'
List<FileTree> mainTags = tagTrees(mainResources, project)
List<FileTree> generatedTags = tagTrees(generatedResources, project)

processResources {
