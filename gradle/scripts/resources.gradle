import java.nio.file.Files
import java.nio.file.StandardCopyOption

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.gradle.work.FileChange
import org.gradle.work.Incremental
import org.gradle.work.InputChanges

File mainResources = file('src/main/resources')
File generatedResources = file('src/generated/resources')
String tagPattern = 'data/*/tags/**/*.json'
List<FileTree> mainTags = tagTrees(mainResources, project)
List<FileTree> generatedTags = tagTrees(generatedResources, project)

List<String> filterList = [
        'META-INF/mods.toml',
        'pack.mcmeta'
]

// processResources only handles the files it cares about: the metadata and the json tags.
// Everything else goes through syncResources, which works incrementally.
List<String> processedResources = filterList + [tagPattern]

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    include(processedResources)

    Map<String, Object> replaceProperties = [
            'mod_id'              : "${mod_id}",
            'mod_name'            : "${mod_name}",
            'mod_version'         : "${mod_version}",
            'mod_description'     : "${mod_description}",
            'mod_authors'         : "${mod_authors}",
            'mod_credits'         : "${mod_credits}",
            'mod_url'             : "${mod_url}",
            'mod_logo_path'       : "${mod_logo_path}",
            'minecraft_version'   : "${minecraft_version}",
            'forge_version'       : "${forge_version}",
            'forge_version_range' : "${loader_version_range}",
            'loader_version_range': "${loader_version_range}"
    ]

    inputs.properties(replaceProperties)

    filesMatching(filterList) {
        expand(replaceProperties + [project: project])
    }

    doLast {
        mergeTags(mainResources, generatedResources, mainTags, generatedTags, destinationDir)
    }
}

Provider<Directory> syncedResources = layout.buildDirectory.dir('resources/mainSynced')

TaskProvider<SyncResources> syncResources = tasks.register('syncResources', SyncResources) {
    List<File> resourceDirs = sourceSets.main.resources.srcDirs as List
    sourceDirs = resourceDirs
    resourceDirs.each { dir -> sources.from(fileTree(dir) { exclude(processedResources) }) }
    destinationDir = syncedResources
}

// Register syncResources dir as sourceSets output to put it in the jar and in runClient/runServer
sourceSets.main.output.dir([builtBy: syncResources], syncedResources)

processDevResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

static List<FileTree> tagTrees(File resources, Project project) {
    File data = new File(resources, 'data')
    return (data.listFiles() ?: [])
            .collect { new File(it, 'tags') }
            .findAll { it.isDirectory() }
            .collect { project.fileTree(it) { include('**/*.json') } }
}

static Set<String> tagPaths(File root, List<FileTree> trees) {
    Set<String> paths = new LinkedHashSet<>()
    trees.each { tree ->
        tree.files.each { file ->
            paths.add(root.toPath().relativize(file.toPath()).toString().replace('\\', '/'))
        }
    }
    return paths
}

static void mergeTags(
        File mainResources,
        File generatedResources,
        List<FileTree> mainTags,
        List<FileTree> generatedTags,
        File destinationDir
) {
    Set<String> mainPaths = tagPaths(mainResources, mainTags)
    Set<String> generatedPaths = tagPaths(generatedResources, generatedTags)
    Set<String> paths = mainPaths.intersect(generatedPaths)

    JsonSlurper slurper = new JsonSlurper()

    paths.each { String path ->
        File mainFile = new File(mainResources, path)
        File generatedFile = new File(generatedResources, path)
        File targetFile = new File(destinationDir, path)

        targetFile.parentFile.mkdirs()

        if (!mainFile.exists()) {
            targetFile.bytes = generatedFile.bytes
            return
        }

        if (!generatedFile.exists()) {
            targetFile.bytes = mainFile.bytes
            return
        }

        Map<String, Object> main = slurper.parse(mainFile) as Map<String, Object>
        Map<String, Object> generated = slurper.parse(generatedFile) as Map<String, Object>

        if (main['replace'] == true) {
            targetFile.bytes = mainFile.bytes
            return
        }

        if (generated['replace'] == true) {
            targetFile.bytes = generatedFile.bytes
            return
        }

        Set<Object> values = new LinkedHashSet<>()

        List<Object> mainValues = (main['values'] ?: []) as List<Object>
        List<Object> generatedValues = (generated['values'] ?: []) as List<Object>

        values.addAll(mainValues)
        values.addAll(generatedValues)

        main['values'] = new ArrayList<>(values)

        targetFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(main)
        )
    }
}

/**
 * Copies resource dirs into one output dir like a Copy task, but after the first run it only copies the files that
 * changed and deletes the ones that were removed. When a path exists in more than one source dir, the last dir wins,
 * the same as processResources with DuplicatesStrategy.INCLUDE.
 */
abstract class SyncResources extends DefaultTask {
    /** The source dirs in priority order, lowest first. {@link #getSources} holds the files to copy from them. */
    @Internal
    abstract ListProperty<File> getSourceDirs()

    @Incremental
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getSources()

    @OutputDirectory
    abstract DirectoryProperty getDestinationDir()

    @TaskAction
    void sync(InputChanges changes) {
        File destination = destinationDir.get().asFile
        if (!changes.incremental) {
            // First time running, or last run had an issue: start from an empty dir
            destination.deleteDir()
            destination.mkdirs()
        }

        List<File> dirsByPriority = sourceDirs.get().reverse()
        for (FileChange change : changes.getFileChanges(sources)) {
            if (change.fileType == FileType.DIRECTORY) {
                continue
            }

            // A change in one dir can hide or reveal the same path in another, so look up which file wins now
            String path = change.normalizedPath
            File source = dirsByPriority.collect { new File(it, path) }.find { it.isFile() }
            File target = new File(destination, path)

            if (source != null) {
                target.parentFile.mkdirs()
                Files.copy(source.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING)
            } else {
                target.delete()
                deleteEmptyParents(target.parentFile, destination)
            }
        }
    }

    private static void deleteEmptyParents(File dir, File root) {
        while (dir != root && dir.list()?.length == 0) {
            dir.delete()
            dir = dir.parentFile
        }
    }
}

tasks.register("prepareServerDev") {

    File serverDir = file("run/server")
    File eulaFile = file("${serverDir}/eula.txt")
    File propsFile = file("${serverDir}/server.properties")

    outputs.files(eulaFile, propsFile)

    doLast {
        serverDir.mkdirs()

        eulaFile.text = 'eula=true\n'

        Properties properties = new Properties()

        if (propsFile.exists()) {
            propsFile.withReader('UTF-8') {
                properties.load(it)
            }
        }

        properties.setProperty('online-mode', 'false')

        propsFile.withWriter('UTF-8') {
            properties.store(it, null)
        }
    }
}