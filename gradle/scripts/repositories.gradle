repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name('Mixin maven')
        url('https://maven.bawnorton.com/releases')
        content {
            includeGroup('com.github.bawnorton.mixinsquared')
        }
    }
    maven {
        name('CurseMaven')
        url('https://cursemaven.com')
        content {
            includeGroup('curse.maven')
        }
    }
    maven {
        name('Modrinth')
        url('https://api.modrinth.com/maven')
        content {
            includeGroup('maven.modrinth')
        }
    }
    maven {
        name('Squiddev maven')
        url('https://squiddev.cc/maven')
        content {
            includeGroup('cc.tweaked')
        }
    }
    maven {
        name('Create Maven')
        url('https://maven.createmod.net')
        content {
            includeGroup('com.simibubi.create')
            includeGroup('net.createmod.ponder')
            includeGroup('dev.engine-room.flywheel')
        }
    }
    maven {
        name('ModMaven')
        url('https://modmaven.dev')
        content {
            includeGroup('com.tterrag.registrate')
        }
    }
    maven {
        name('Expandium')
        url('https://repo.expandium.net/releases')
        content {
            includeGroup('de.mari_023')
        }
    }
    // migrate this before a full release
    maven {
        name('Expandium Snapshots')
        url('https://repo.expandium.net/snapshots')
        content {
            includeGroup('appeng')
        }
    }
}
