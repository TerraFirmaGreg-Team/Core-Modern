[versions]
mixin = "0.8.7"
mixinextras = "0.5.0"
mixinsquared = "0.3.6-beta.1"
registrate = "MC1.20-1.3.11"

[libraries]
annotations = { module = "org.jetbrains:annotations", version = "26.0.2" }
lombok = { module = "org.projectlombok:lombok", version = "1.18.38" }

# The "processor" classifier is attached at the dependency site via variantOf.
mixin = { module = "org.spongepowered:mixin", version.ref = "mixin" }

mixinextrasCommon = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixinextras" }
mixinextrasForge = { module = "io.github.llamalad7:mixinextras-forge", version.ref = "mixinextras" }
mixinsquaredCommon = { module = "com.github.bawnorton.mixinsquared:mixinsquared-common", version.ref = "mixinsquared" }
mixinsquaredForge = { module = "com.github.bawnorton.mixinsquared:mixinsquared-forge", version.ref = "mixinsquared" }

registrate = { module = "com.tterrag.registrate:Registrate", version.ref = "registrate" }

[plugins]
moddevLegacyforge = { id = "net.neoforged.moddev.legacyforge", version = "2.0.119" }
spotless = { id = "com.diffplug.spotless", version = "7.2.1" }
manifestClasspath = { id = "com.github.ManifestClasspath", version = "0.1.0-RELEASE" }
